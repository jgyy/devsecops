name: DAST Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sample-app image
        run: docker build -t sample-app:ci sample-app

      - name: Start sample-app
        run: |
          docker run -d -p 3000:3000 --name sample-app sample-app:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "sample-app did not become healthy in time" >&2
          docker logs sample-app
          exit 1

      - name: Run ZAP baseline scan (blocking gate)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:3000"
          docker_name: "ghcr.io/zaproxy/zaproxy:2.17.0"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report
